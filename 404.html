<!doctype html>
<html lang="en">
<head>

<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://thefirmfoundation.app/404">
<link rel="icon" href="/assets/favicon.ico">
<meta name="theme-color" content="#C4911A">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07090F;--surface:#0D1119;--gold:#C4911A;--tp:#E8ECF4;--tm:#8A96B0;--ts:#4E5A72;--border:#1E2B42}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--tp);
       font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;
       justify-content:center;padding:24px;text-align:center}
  .wrap{max-width:440px}
  .code{font-family:'Barlow Condensed',sans-serif;font-size:84px;font-weight:800;
        line-height:1;color:var(--gold);letter-spacing:1px}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;
     text-transform:uppercase;letter-spacing:0.6px;margin:6px 0 12px}
  p{color:var(--tm);font-size:14px;line-height:1.7;margin:0 0 28px}
  .links{display:flex;flex-direction:column;gap:10px}
  a.primary{display:block;padding:13px;background:var(--gold);color:#07090F;
            text-decoration:none;border-radius:10px;font-weight:600;font-size:14px}
  .row{display:flex;gap:16px;justify-content:center;margin-top:6px}
  .row a{color:var(--tm);font-size:12.5px;text-decoration:underline}
  a:hover{opacity:.85}
</style>
</head>

  <div class="wrap">
    <div class="code">404</div>

    <div class="links">

      <div class="row">
        <a href="/">Home</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="mailto:support@thefirmfoundation.app">Support</a>
      </div>
    </div>
  </div>
</body>
</html>
