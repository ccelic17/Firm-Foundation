name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow only needs to check out and test.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax, handlers, and browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser binary lives outside node_modules, so cache it separately.
      # Keyed on the lockfile: a Playwright version bump invalidates the cache.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # --with-deps pulls the system libraries Chromium needs; only required
        # when we did not restore a cache hit.
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Chromium system deps (cache hit)
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # Runs all three gates:
      #   check:functions — node --check on every Netlify function
      #   check:app       — inline script parse + inline on*= handler resolution
      #   check:boot      — 38 headless-Chromium assertions, including the run
      #                     with the Dexie CDN blocked
      - name: Run checks
        run: npm run check
