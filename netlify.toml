[build]
  command = ""
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/whoop-auth"
  to = "/.netlify/functions/whoop-auth"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
